# Coturn TURN server - production config for LiveKit
# TLS: Place Let's Encrypt certs in ../certs/ (see README)
# Values with PLACEHOLDER_ are replaced by deploy.sh

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Public IP - required when behind NAT
external-ip=PLACEHOLDER_EXTERNAL_IP

# Realm for authentication
realm=PLACEHOLDER_TURN_REALM

# Long-term credentials (LiveKit uses these in turn_servers config)
lt-cred-mech
user=livekit:PLACEHOLDER_TURN_CREDENTIAL

# TLS certificates - use Let's Encrypt (not self-signed)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Security
fingerprint
no-multicast-peers
no-cli

# Relay port range (restrict for Docker)
min-port=49152
max-port=49252

# Deny loopback (prevent relay to localhost)
denied-peer-ip=127.0.0.1-127.255.255.255
