# LiveKit cluster-ready deployment
# https://github.com/livekit/livekit
# Uses bridge network so Redis is at hostname "redis" (avoids host-network issues on Coolify/Docker Desktop).

services:
  livekit-server:
    build:
      context: .
      dockerfile: Dockerfile.livekit
    image: livekit/livekit-server:v1.9
    container_name: livekit-server
    restart: unless-stopped
    ports:
      - "7880:7880"   # WebSocket/API
      - "7881:7881"   # ICE TCP
      - "50000-60000:50000-60000/udp"   # WebRTC UDP
    environment:
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TURN_HOST: ${TURN_HOST}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_REGION: ${LIVEKIT_REGION}
      LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL}
      LIVEKIT_PUBLIC_IP: ${LIVEKIT_PUBLIC_IP:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7880"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  redis-data:
