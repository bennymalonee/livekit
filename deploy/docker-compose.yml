# LiveKit cluster-ready deployment
# https://github.com/livekit/livekit
# Base: livekit-server + redis. Coturn added via docker-compose.coturn.yml when certs present.

services:
  livekit-server:
    build:
      context: .
      dockerfile: Dockerfile.livekit
    image: livekit/livekit-server:v1.9
    container_name: livekit-server
    # Entrypoint expands ${REDIS_PASSWORD} etc. in livekit.yaml and starts server
    command: null
    restart: unless-stopped
    network_mode: host
    volumes:
      # Mount template so entrypoint can write expanded config to /etc/livekit/livekit.yaml (file, not directory)
      - ./livekit.yaml:/etc/livekit/livekit.yaml.template:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7880"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  redis-data:
