# NGINX reverse proxy for LiveKit
# live.yourdomain.com → localhost:7880
# Replace yourdomain.com with your domain
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled

upstream livekit_backend {
    server 127.0.0.1:7880;
    keepalive 64;
}

# HTTP - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name live.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS with WebSocket (WSS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.yourdomain.com;

    # Let's Encrypt (certbot)
    ssl_certificate /etc/letsencrypt/live/live.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://livekit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # HLS egress - proxy to MinIO
    location /hls/ {
        proxy_pass http://127.0.0.1:9000/livekit-hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2";
        add_header Access-Control-Allow-Origin "*";
    }
}
