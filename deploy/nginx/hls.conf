# NGINX - HLS proxy from MinIO
# Add to your server block or use as separate server
# HLS URL: https://live.yourdomain.com/hls/recordings/ROOM_ID_EGRESS_ID/playlist.m3u8

location /hls/ {
    proxy_pass http://127.0.0.1:9000/livekit-hls/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HLS caching
    add_header Cache-Control "public, max-age=2";
    add_header Access-Control-Allow-Origin "*";
}
