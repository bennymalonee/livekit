# LiveKit Server Configuration - Cluster-ready production
# https://github.com/livekit/livekit
# Placeholder values replaced by deploy script - set LIVEKIT_PUBLIC_IP before deploy

port: 7880

# Redis - required for distributed/cluster mode
redis:
  # Use 127.0.0.1 when LiveKit runs with host network (redis port published to host)
  address: 127.0.0.1:6379
  password: ${REDIS_PASSWORD}
  db: 0

# WebRTC configuration
rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: true
  # Set node_ip when use_external_ip discovery fails (e.g. behind NAT)
  # node_ip: ${LIVEKIT_PUBLIC_IP}
  turn_servers:
    - host: ${TURN_HOST}
      port: 3478
      protocol: udp
      username: livekit
      credential: ${TURN_CREDENTIAL}
    - host: ${TURN_HOST}
      port: 5349
      protocol: tls
      username: livekit
      credential: ${TURN_CREDENTIAL}

# API keys - JWT authentication
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

# Region tag for cluster node selection
region: ${LIVEKIT_REGION}

# Logging
logging:
  level: info
  pion_level: error
