# LiveKit Server Configuration - Cluster-ready production
# https://github.com/livekit/livekit
# Placeholder values replaced by deploy script - set LIVEKIT_PUBLIC_IP before deploy

port: 7880

# Redis - required for distributed/cluster mode
redis:
  # Set REDIS_ADDRESS=redis:6379 for bridge network, or 127.0.0.1:6379 for host network
  address: ${REDIS_ADDRESS}
  password: ${REDIS_PASSWORD}
  db: 0

# WebRTC configuration
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: true
  # Set node_ip when use_external_ip discovery fails (e.g. behind NAT)
  # node_ip: ${LIVEKIT_PUBLIC_IP}
  turn_servers:
    - host: ${TURN_HOST}
      port: 3478
      protocol: udp
      username: livekit
      credential: ${TURN_CREDENTIAL}
    - host: ${TURN_HOST}
      port: 5349
      protocol: tls
      username: livekit
      credential: ${TURN_CREDENTIAL}

# API keys - JWT authentication
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

# Region tag for cluster node selection
region: ${LIVEKIT_REGION}

# Webhook - send room/participant events to Convex (set LIVEKIT_WEBHOOK_URL in Coolify)
# e.g. LIVEKIT_WEBHOOK_URL=https://patient-crocodile-0.eu-west-1.convex.site/livekit-webhook
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - ${LIVEKIT_WEBHOOK_URL}

# Logging
logging:
  level: info
  pion_level: error
