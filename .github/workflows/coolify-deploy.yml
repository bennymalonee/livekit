# Deploy to Coolify on push to main (replaces webhook auto-deploy when using Public GitHub source).
# Required repo secrets: COOLIFY_TOKEN, COOLIFY_BASE_URL, COOLIFY_DASHBOARD_APP_UUID (your Dashboard app UUID from Coolify).
name: Deploy to Coolify
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -sSf -X GET \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_DASHBOARD_APP_UUID }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
